# Every language must carry exactly the English key set, with identical
# placeholders and no empty values (tests/test_i18n_parity.py). The test needs
# only the standard library and pytest.
name: i18n parity

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest numpy
      - run: python -m pytest tests/test_i18n_parity.py tests/test_template_literals.py tests/test_units_js.py tests/test_plotly_locale.py -q
