# Builds the Shelly Energy Analyzer image and publishes it to the GitHub
# Container Registry, so `docker pull ghcr.io/<owner>/<repo>:latest` works and
# Watchtower can keep an installation current without anyone touching it.
name: Publish container image

on:
  push:
    branches: [main]
    # 🔴 Eine Aenderung an Text baut kein neues Abbild (04.10.2026). Sonst
    # wuerde ein README-Satz die Versionsmarke neu belegen — und damit genau
    # das Abbild ersetzen, das die Rauchprobe angefahren hat.
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# 🔴 Deliberately NOT on tags. A push to main publishes the version mark; a tag
# would start a build from the TAGGED commit. Tags stay git markers and release
# archives here; the image comes from main.
#
# 🔴 AND THIS BUILD NO LONGER MOVES `:latest` (04.10.2026) — see the tag list
# below and `promote.yml`.

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Which marks this build may set — decided ONCE, before any build ──
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      slug: ${{ steps.repo.outputs.slug }}
      version: ${{ steps.ver.outputs.version }}
      tags: ${{ steps.marken.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Repository name in lower case
        id: repo
        # GHCR refuses an upper-case path: "repository name must be lowercase".
        run: echo "slug=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Read version
        id: ver
        # 🔑 The authoritative version lives in __init__.py — the same file the
        #    running app reports. Reading it anywhere else would let the image
        #    tag and the program disagree.
        run: |
          echo "version=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/shelly_analyzer/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 🔴 EINE VEROEFFENTLICHTE VERSIONSMARKE BEWEGT SICH NIE (04.10.2026).
      #
      # `promote.yml` haengt `:latest` an das Manifest, das die Rauchprobe
      # angefahren hat. Wuerde ein spaeterer Push dieselbe Versionsnummer neu
      # belegen, zeigte `:latest` ploetzlich auf ein Abbild, das niemand
      # geprueft hat — dasselbe Loch, nur eine Ebene tiefer.
      - name: Eine veroeffentlichte Versionsmarke wird nie ueberschrieben
        id: marken
        run: |
          set -euo pipefail
          SLUG="ghcr.io/${{ steps.repo.outputs.slug }}"
          V="${{ steps.ver.outputs.version }}"

          # 🔴 DREI FAELLE, NICHT ZWEI. Der erste Entwurf fragte
          # `if imagetools inspect …; then`. Auf einer Maschine ohne
          # Docker-Dienst schlug der Aufruf fehl — und der Waechter las das als
          # „die Marke gibt es nicht" und haette sie ueberschrieben. Ein
          # Waechter, der „konnte nicht fragen" mit „ist frei" verwechselt, ist
          # schlechter als keiner.
          antwort="$(docker buildx imagetools inspect "$SLUG:$V" 2>&1)" && rc=0 || rc=$?
          if [ "$rc" = "0" ]; then
            vorhanden=ja
          elif printf '%s' "$antwort" | grep -qi 'not found\|manifest unknown\|MANIFEST_UNKNOWN\|denied\|was not found'; then
            vorhanden=nein
          else
            echo "::error::Konnte die Registry nicht nach $SLUG:$V fragen. Es wird NICHTS veroeffentlicht, damit keine gepruefte Marke ueberschrieben wird."
            printf '%s\n' "$antwort"
            exit 1
          fi

          if [ "$vorhanden" = "ja" ]; then
            MARKEN="$SLUG:edge"
            echo "::warning::$SLUG:$V ist bereits veroeffentlicht und wird NICHT ersetzt — es wird nur :edge erneuert. Die Nummer in src/shelly_analyzer/__init__.py erhoehen, wenn das eine neue Fassung werden soll."
          else
            # printf, kein eingebetteter Umbruch: eine Zeile auf Spalte 0 beendet
            # den YAML-Block hier mitten im Skript.
            MARKEN="$(printf '%s\n%s' "$SLUG:$V" "$SLUG:edge")"
          fi
          echo "Marken, die dieser Bau setzt:"
          echo "$MARKEN" | sed 's/^/  /'
          {
            echo "tags<<ENDE_DER_MARKEN"
            echo "$MARKEN"
            echo "ENDE_DER_MARKEN"
          } >> "$GITHUB_OUTPUT"

  # ── 2. One build per architecture, each on its own NATIVE runner ────────
  # 🔑 amd64 AND arm64 since 17.7.0 — the one-line Docker install is for
  # everybody, and a Raspberry Pi or an Apple-silicon Mac is arm64. Until then
  # this said "amd64 only — on purpose": an EMULATED arm64 build of
  # numpy/pandas/pillow took the better part of an hour. GitHub's arm64
  # runners build natively, in parallel with amd64, so that cost is gone.
  # Each build pushes by DIGEST only — no mark yet; step 3 sets the marks on
  # one manifest that carries both.
  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ needs.prepare.outputs.slug }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false

      - name: Keep the digest for the manifest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── 3. The marks, on ONE manifest for both architectures ────────────────
  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 🔴 HIER STEHT KEIN `:latest` MEHR (04.10.2026). Es stand hier — und
      # damit wanderte das Etikett, dem jede Installation ueber Watchtower
      # folgt, in dem Moment, in dem ein Commit auf main landete. Also
      # bevor irgendetwas das gebaute Abbild angesehen hatte.
      #
      # Am 04.10.2026 ging bei DocuSort auf genau diesem Weg eine Fassung
      # hinaus, die auf bestehenden Datenbanken nicht startete. Watchtower
      # verteilte sie binnen einer Stunde an alle Installationen; die
      # Installationen standen still — und waeren NICHT von selbst
      # zurueckgekommen, weil Watchtower abstuerzende Container
      # ueberspringt (`scanned=0`, am Pi nachgestellt).
      #
      # Jetzt setzt `promote.yml` das Etikett — von Hand, und erst nachdem
      # es das VEROEFFENTLICHTE Abbild selbst angefahren hat.
      - name: Publish the marks on one manifest
        working-directory: /tmp/digests
        env:
          SLUG: ghcr.io/${{ needs.prepare.outputs.slug }}
          MARKEN: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r m; do
            [ -n "$m" ] && args+=(-t "$m")
          done <<< "$MARKEN"
          [ "${#args[@]}" -gt 0 ] || { echo "::error::no marks to set"; exit 1; }
          quellen=()
          for d in *; do quellen+=("$SLUG@sha256:$d"); done
          [ "${#quellen[@]}" -eq 2 ] || { echo "::error::expected 2 digests, got ${#quellen[@]}"; exit 1; }
          docker buildx imagetools create "${args[@]}" "${quellen[@]}"

      # „Created" is not „carries both". Ask the registry what the mark holds.
      - name: The manifest carries amd64 AND arm64
        env:
          SLUG: ghcr.io/${{ needs.prepare.outputs.slug }}
        run: |
          set -euo pipefail
          out="$(docker buildx imagetools inspect "$SLUG:edge")"
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q 'linux/amd64' || { echo "::error::amd64 missing"; exit 1; }
          printf '%s' "$out" | grep -q 'linux/arm64' || { echo "::error::arm64 missing"; exit 1; }
