name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[charts]" pytest playwright
      - run: playwright install --with-deps chromium
      - name: Run walkthrough and API tour (quick)
        env:
          SEA_E2E: "1"
          SEA_E2E_REPORT: ${{ github.workspace }}/e2e-report.json
        run: python -m pytest tests/e2e -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: e2e-report*.json
          if-no-files-found: ignore
